baseURL = 'https://noahsblog.pages.dev/'
locale = 'en-US'
title = "Noah's Blog"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[module]
  [module.hugoVersion]
    extended = false
    min = '0.93.0'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[permalinks]
  posts = '/posts/:slugorcontentbasename/'

[params]
  description = "A running archive of Noah's research notes, development work, and passing thoughts."
  personalSite = 'https://noahisarider.github.io/'
  cvURL = 'https://noahisarider.github.io/cv/'
  comments = false
  showtoc = true
  showreadingtime = true
  showlastmod = true
  mainSections = ['posts']
  footerText = 'Built with Hugo.'
  githubURL = 'https://github.com/NoahIsARider'

  [params.author]
    name = 'NoahIsARider'
    email = ''

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['\\(', '\\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = 'algol_nu'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  expiryDate = ['expiryDate']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']

[outputFormats.RSS]
  mediaType = 'application/rss+xml'

# a second, friendlier feed URL — /feed.xml alongside the conventional /index.xml.
# Both are generated on every build, so a host that reuses its workspace (Cloudflare
# Pages builds with its own command) can never keep serving a stale feed at either path.
[outputFormats.Feed]
  mediaType = 'application/rss+xml'
  baseName = 'feed'
  isPlainText = false
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'Feed']
  section = ['HTML', 'RSS', 'Feed']
  taxonomy = ['HTML', 'RSS', 'Feed']
  term = ['HTML', 'RSS', 'Feed']

[menu]
  [[menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menu.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40

