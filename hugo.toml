baseURL = 'https://noahsblog.pages.dev/'
locale = 'en-US'
title = "Noah's Blog"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[module]
  [module.hugoVersion]
    extended = false
    min = '0.93.0'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[permalinks]
  posts = '/posts/:slugorcontentbasename/'

[params]
  description = "A running archive of Noah's research notes, development work, and passing thoughts."
  personalSite = 'https://noahisarider.github.io/'
  comments = false
  showtoc = true
  showreadingtime = true
  showlastmod = true
  mainSections = ['posts']
  footerText = 'Built with Hugo.'
  githubURL = 'https://github.com/NoahIsARider'

  [params.author]
    name = 'NoahIsARider'
    email = ''

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['\\(', '\\)']]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = 'algol_nu'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  expiryDate = ['expiryDate']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']

[outputFormats.RSS]
  mediaType = 'application/rss+xml'
  # /feed.xml at the site root (and /posts/feed.xml, /tags/<tag>/feed.xml) —
  # index.xml still works for feeds, this is just the friendlier, shareable name
  baseName = 'feed'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']

[menu]
  [[menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menu.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40

